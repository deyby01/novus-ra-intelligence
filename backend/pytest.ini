[pytest]
# The container ships DJANGO_SETTINGS_MODULE=config.settings.dev (from .env),
# and pytest-django gives that env var precedence over this ini key. The `--ds`
# command-line option is the only source that overrides it, so it is required
# to run the suite under the test settings (eager Celery).
DJANGO_SETTINGS_MODULE = config.settings.test
addopts = --ds=config.settings.test
python_files = test_*.py
